<div class="app-snackbar-content">
    <mat-icon aria-hidden="true">{{ icon }}</mat-icon>
    <span class="app-snackbar-message">{{ data.message }}</span>
    <button mat-icon-button type="button" aria-label="Close notification" (click)="dismiss()">
        <mat-icon aria-hidden="true">close</mat-icon>
    </button>
</div>
