<h2 mat-dialog-title>
    <mat-icon color="primary" aria-hidden="true">help_outline</mat-icon>
    <span>{{ data.question }}</span>
</h2>
<mat-dialog-actions align="end">
    <button mat-button color="warn" type="button" [mat-dialog-close]="true">Yes</button>
    <button mat-flat-button color="primary" type="button" [mat-dialog-close]="false" cdkFocusInitial>No</button>
</mat-dialog-actions>
