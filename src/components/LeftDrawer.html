<mat-sidenav-container class="drawer-container">
    <mat-sidenav
        id="mobile-navigation-drawer"
        class="drawer"
        role="navigation"
        [mode]="isMobile() ? 'over' : 'side'"
        [opened]="!isMobile() || mobileOpen()"
        (closed)="closeMobileMenu()"
    >
        <div class="drawer-content">
            <mat-nav-list class="navigation-list" aria-label="Main navigation">
                @for (menuItem of visibleMenuItems; track $index) {
                    @if (menuItem.kind === 'divider') {
                        <mat-divider></mat-divider>
                    } @else {
                        <a
                            mat-list-item
                            [routerLink]="menuItem.route"
                            routerLinkActive
                            #activeLink="routerLinkActive"
                            [routerLinkActiveOptions]="{ exact: menuItem.route === '/' }"
                            [activated]="activeLink.isActive"
                            (pointerdown)="pointerInteraction()"
                            (keydown)="keyboardInteraction()"
                            (click)="menuOptionSelected(menuItem)"
                        >
                            <mat-icon matListItemIcon>{{ menuItem.icon }}</mat-icon>
                            <span matListItemTitle>{{ menuItem.text }}</span>
                        </a>
                    }
                }
            </mat-nav-list>

            <footer class="drawer-links">
                <a
                    class="drawer-external-link github-link"
                    href="https://github.com/recordstuff/bretts-angular"
                    target="_blank"
                    rel="noopener noreferrer"
                    (click)="closeMobileMenu()"
                >
                    <svg class="github-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M12 2C6.48 2 2 6.48 2 12c0 4.42 2.87 8.17 6.84 9.49.5.09.66-.22.66-.47v-1.73c-2.78.6-3.37-1.34-3.37-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.9 1.53 2.34 1.09 2.91.83.09-.65.35-1.09.64-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02A9.58 9.58 0 0 1 12 6.8c.85 0 1.71.12 2.5.34 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85v2.79c0 .25.16.56.67.46A10 10 0 0 0 22 12c0-5.52-4.48-10-10-10" />
                    </svg>
                    GitHub Repo
                </a>
                <a
                    class="drawer-external-link"
                    href="https://brettdrake.org/"
                    target="_blank"
                    rel="noopener noreferrer"
                    (click)="closeMobileMenu()"
                >
                    brettdrake.org
                </a>
            </footer>
        </div>
    </mat-sidenav>

    <mat-sidenav-content>
        <mat-toolbar class="app-toolbar" color="primary">
            @if (isMobile()) {
                <button
                    class="menu-button"
                    mat-icon-button
                    type="button"
                    aria-controls="mobile-navigation-drawer"
                    aria-label="Toggle navigation menu"
                    [attr.aria-expanded]="mobileOpen()"
                    [class.suppress-program-focus]="!showRestoredFocus()"
                    (pointerdown)="pointerInteraction()"
                    (keydown)="keyboardInteraction()"
                    (click)="toggleMobileMenu()"
                >
                    <mat-icon>menu</mat-icon>
                </button>
            }

            <span class="page-title">{{ appState.pageTitle() }}</span>

            <span class="account">
                <span class="display-name">{{ displayName }}</span>
                <a class="logout-link" routerLink="/login" title="Go back to the login screen.">Logout</a>
            </span>
        </mat-toolbar>

        <main class="page-content">
            <app-breadcrumbinator />
            <router-outlet></router-outlet>
        </main>
    </mat-sidenav-content>
</mat-sidenav-container>
