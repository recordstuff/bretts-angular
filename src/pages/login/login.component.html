<div class="login-container">
    <div class="credential-actions" role="group" aria-label="Populate with credentials">
        <button mat-button type="button" (click)="populateWithAdminAndUserCredentials()">
            Admin and User rights
        </button>
        <button mat-button type="button" (click)="populateWithAdminOnlyCredentials()">
            Admin rights only
        </button>
        <button mat-button type="button" (click)="populateWithUserOnlyCredentials()">
            User rights only
        </button>
    </div>
    <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput [(ngModel)]="UserCredentials.Email" type="email" placeholder="Email">
    </mat-form-field>
    <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput [(ngModel)]="UserCredentials.Password" type="password" placeholder="Password" />
    </mat-form-field>
    <button
        color="primary"
        mat-stroked-button
        type="button"
        [disabled]="isLoggingIn"
        (click)="handleClick()"
    >
        {{ isLoggingIn ? 'Logging in…' : 'Login' }}
    </button>
    @if (loginError.length > 0) {
        <p class="login-error" role="alert">{{ loginError }}</p>
    }
    <p>
        This is VERY incomplete. Please see the
        <a href="https://nextjs.brettdrake.org/">NextJS React project</a>
        or <a href="https://solidjs.brettdrake.org/">SolidJS project</a>.
    </p>
</div>
