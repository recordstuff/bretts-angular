<section class="crud-list-page">
    <a class="crud-add-button" mat-stroked-button routerLink="/role">
        <mat-icon aria-hidden="true">add</mat-icon>
        Add Role
    </a>

    <div class="crud-filters">
        <mat-form-field appearance="outline">
            <mat-label>Search Text</mat-label>
            <input matInput type="search" [formControl]="searchText">
        </mat-form-field>
    </div>

    <div class="crud-table-container">
        <table
            class="crud-table roles-table"
            aria-label="Roles"
            mat-table
            matSort
            matSortActive="Name"
            matSortDirection="asc"
            matSortDisableClear
            [dataSource]="paginationResult().Items"
            (matSortChange)="sortChanged($event)"
        >
            <ng-container matColumnDef="Guid">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Id</th>
                <td mat-cell *matCellDef="let role">
                    <a [routerLink]="['/role', role.Guid]">{{ role.Guid }}</a>
                </td>
            </ng-container>

            <ng-container matColumnDef="Name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
                <td mat-cell *matCellDef="let role">{{ role.Name }}</td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

            <tr class="crud-empty-row" *matNoDataRow>
                <td [attr.colspan]="displayedColumns.length">No roles matched the current filters.</td>
            </tr>
        </table>
    </div>

    <app-pagination-controls
        itemName="roles"
        [page]="page()"
        [pageSize]="pageSize"
        [paginationResult]="paginationResult()"
        (pageChange)="pageChanged($event)"
    />
</section>
