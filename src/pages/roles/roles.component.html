<section class="roles-page">
    <a class="add-role" mat-stroked-button routerLink="/role">
        <mat-icon aria-hidden="true">add</mat-icon>
        Add Role
    </a>

    <div class="filters">
        <mat-form-field appearance="outline">
            <mat-label>Search Text</mat-label>
            <input matInput type="search" [formControl]="searchText">
        </mat-form-field>
    </div>

    <div class="roles-table-container">
        <table
            aria-label="Roles"
            mat-table
            matSort
            matSortActive="Name"
            matSortDirection="asc"
            matSortDisableClear
            [dataSource]="paginationResult().Items"
            (matSortChange)="sortChanged($event)"
        >
            <ng-container matColumnDef="Guid">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Id</th>
                <td mat-cell *matCellDef="let role">
                    <a [routerLink]="['/role', role.Guid]">{{ role.Guid }}</a>
                </td>
            </ng-container>

            <ng-container matColumnDef="Name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
                <td mat-cell *matCellDef="let role">{{ role.Name }}</td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

            <tr class="empty-row" *matNoDataRow>
                <td [attr.colspan]="displayedColumns.length">No roles matched the current filters.</td>
            </tr>
        </table>
    </div>

    <div class="pagination">
        <span>Page {{ paginationResult().Page }} of {{ paginationResult().PageCount }}</span>
        <mat-paginator
            aria-label="Select roles page"
            [length]="paginationResult().ItemCount"
            [pageIndex]="page() - 1"
            [pageSize]="pageSize"
            [hidePageSize]="true"
            [showFirstLastButtons]="true"
            (page)="pageChanged($event)"
        />
    </div>
</section>
