<form class="role-form" [formGroup]="form" (ngSubmit)="save()">
    @if (isEdit()) {
        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Id</mat-label>
            <input matInput [value]="role().Guid" disabled>
        </mat-form-field>
    }

    <mat-form-field appearance="outline" class="full-width">
        <mat-label>Name</mat-label>
        <input matInput formControlName="Name" required>
        @if (form.controls.Name.touched && form.controls.Name.hasError('required')) {
            <mat-error>Name is required.</mat-error>
        }
    </mat-form-field>

    <div class="form-actions full-width">
        <button mat-flat-button color="primary" type="submit" [disabled]="isSaving()">
            @if (isEdit()) {
                Save
            }
            @else {
                Add
            }
        </button>
        <button class="cancel-button" mat-button type="button" [disabled]="isSaving()" (click)="cancel()">
            @if (isEdit()) {
                Reset Form
            }
            @else {
                Cancel
            }
        </button>
        @if (isEdit()) {
            <button class="delete-button" mat-flat-button color="warn" type="button" [disabled]="isSaving()" (click)="confirmDelete()">
                Delete
            </button>
        }
    </div>
</form>
